name: Windows release

on:
  push:
    branches: [main, master]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.92.0'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Check release signing configuration
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: pwsh
        run: |
          if (!$env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Set the TAURI_SIGNING_PRIVATE_KEY repository secret before releasing' }
      - run: node scripts/release-version.cjs --check
      - run: node --test scripts/release-version.check.cjs
      - name: Set automatic release version
        run: node scripts/release-version.cjs
      - run: npm run typecheck
      - run: npx vitest run
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Create release draft with generated notes
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          gh release create $tag --target "$env:GITHUB_SHA" --draft --generate-notes --title "Captrain $tag"
          if ($LASTEXITCODE -ne 0) { throw 'Could not create release draft' }
          $id = gh release view $tag --json databaseId --jq '.databaseId'
          if ($LASTEXITCODE -ne 0) { throw 'Could not read release draft' }
          "id=$id" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          $notes = gh release view $tag --json body --jq '.body'
          if ($LASTEXITCODE -ne 0) { throw 'Could not read release notes' }
          $delimiter = [Guid]::NewGuid().ToString()
          "notes<<$delimiter" >> $env:GITHUB_OUTPUT
          $notes >> $env:GITHUB_OUTPUT
          $delimiter >> $env:GITHUB_OUTPUT
      - name: Build and upload signed Windows x64 installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ steps.release.outputs.id }}
          tagName: ${{ steps.release.outputs.tag }}
          releaseBody: ${{ steps.release.outputs.notes }}
          args: --target x86_64-pc-windows-msvc --bundles nsis -- --locked
      - name: Verify updater assets and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: pwsh
        run: |
          gh release download $env:RELEASE_TAG --pattern latest.json --dir release-check
          if ($LASTEXITCODE -ne 0) { throw 'Missing updater manifest' }
          $manifest = Get-Content release-check/latest.json -Raw | ConvertFrom-Json
          $target = $manifest.platforms.'windows-x86_64'
          if (!$target) { $target = $manifest.platforms.'windows-x86_64-nsis' }
          if (!$target.signature -or !$target.url) { throw 'Missing signed Windows update' }
          $assets = gh release view $env:RELEASE_TAG --json assets --jq '.assets[].name'
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect release assets' }
          $installer = [Uri]::UnescapeDataString(([Uri]$target.url).Segments[-1])
          if ($installer -notlike '*.exe' -or $assets -notcontains $installer -or $assets -notcontains "$installer.sig") { throw 'Missing installer or signature' }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release' }
